{{- if .Values.cubemap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "live-stream-packager.fullname" . }}-cubemap
  labels:
    {{- include "live-stream-packager.labels" . | nindent 4 }}
    app.kubernetes.io/component: cubemap
data:
  cubemap.config: |
    num_servers 1
    port {{ .Values.cubemap.httpPort }}
    error_log type=console

    # Health check endpoint
    gen204 /health

    # UDP input - receives MPEG-TS from external source. Empty
    # multicastGroup renders a plain unicast listen (src=udp://@:port); set
    # it to join that group instead -- requires cubemap.hostNetwork, since
    # this cluster's CNI doesn't forward multicast into a pod network
    # namespace.
    # Serves via HTTP for ffmpeg to consume (allows reconnection during rollouts)
    stream /stream.ts src=udp://@{{ if .Values.cubemap.multicastGroup }}{{ .Values.cubemap.multicastGroup }}{{ end }}:{{ .Values.cubemap.udpPort }}
{{- end }}
