apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "live-stream-packager.fullname" . }}
  labels:
    {{- include "live-stream-packager.labels" . | nindent 4 }}
    app.kubernetes.io/component: packager
spec:
  replicas: {{ .Values.replicaCount }}
  # Every pod has its own HLS origin in emptyDir. Overlapping generations can
  # serve a manifest from one origin and a segment from another.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "live-stream-packager.selectorLabels" . | nindent 6 }}
  minReadySeconds: 5
  template:
    metadata:
      labels:
        {{- include "live-stream-packager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: packager
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
        checksum/scripts: {{ include (print $.Template.BasePath "/configmap-scripts.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: shared-data
          emptyDir:
            sizeLimit: {{ .Values.storage.sizeLimit }}
        - name: nginx-config
          configMap:
            name: {{ include "live-stream-packager.fullname" . }}-nginx
        - name: scripts
          configMap:
            name: {{ include "live-stream-packager.fullname" . }}-scripts
            defaultMode: 0555

      containers:
        - name: ffmpeg-transcoder
          image: {{ include "live-stream-packager.image" .Values.image.ffmpeg | quote }}
          imagePullPolicy: {{ .Values.image.ffmpeg.pullPolicy }}
          command: ["ffmpeg"]
          args:
            {{- range .Values.ffmpeg.inputOptions }}
            - {{ . | quote }}
            {{- end }}
            - -i
            - {{ include "live-stream-packager.ffmpegInputUrl" . | quote }}
            {{- range .Values.ffmpeg.encodingOptions }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: PLAYLIST_PATH
              value: {{ .Values.health.mediaPlaylistPath | quote }}
            - name: PLAYLIST_MAX_AGE_SECONDS
              value: {{ .Values.health.maxAgeSeconds | quote }}
            - name: HEALTH_STATE_PATH
              value: /tmp/ffmpeg-playlist-health.state
          volumeMounts:
            - name: shared-data
              mountPath: /stream
            - name: scripts
              mountPath: /scripts
              readOnly: true
          livenessProbe:
            exec:
              command: ["/scripts/playlist-healthcheck.sh", "live"]
            initialDelaySeconds: 60
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: {{ .Values.health.failureThreshold }}
          resources:
            {{- toYaml .Values.resources.ffmpeg | nindent 12 }}

        - name: shaka-packager
          image: {{ include "live-stream-packager.image" .Values.image.packager | quote }}
          imagePullPolicy: {{ .Values.image.packager.pullPolicy }}
          command: ["/scripts/run-packager.sh"]
          args:
            {{- range .Values.shaka.arguments }}
            - {{ . | quote }}
            {{- end }}
          workingDir: /stream
          env:
            - name: TMPDIR
              value: /stream
            - name: SEGMENT_DURATION_SECONDS
              value: {{ .Values.shaka.segmentDurationSeconds | quote }}
            - name: SEGMENT_RETENTION_MINUTES
              value: {{ .Values.shaka.segmentRetentionMinutes | quote }}
            - name: PLAYLIST_PATH
              value: {{ .Values.health.mediaPlaylistPath | quote }}
            - name: PLAYLIST_MAX_AGE_SECONDS
              value: {{ .Values.health.maxAgeSeconds | quote }}
            - name: HEALTH_STATE_PATH
              value: /tmp/packager-playlist-health.state
          volumeMounts:
            - name: shared-data
              mountPath: /stream
            - name: scripts
              mountPath: /scripts
              readOnly: true
          startupProbe:
            exec:
              command: ["/scripts/playlist-healthcheck.sh", "ready"]
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: {{ .Values.health.startupFailureThreshold }}
          livenessProbe:
            exec:
              command: ["/scripts/playlist-healthcheck.sh", "live"]
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: {{ .Values.health.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/scripts/playlist-healthcheck.sh", "ready"]
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: {{ .Values.health.failureThreshold }}
          resources:
            {{- toYaml .Values.resources.packager | nindent 12 }}

        - name: nginx-web
          image: {{ include "live-stream-packager.image" .Values.image.nginx | quote }}
          imagePullPolicy: {{ .Values.image.nginx.pullPolicy }}
          volumeMounts:
            - name: shared-data
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            tcpSocket:
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /index.m3u8
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: {{ .Values.health.failureThreshold }}
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
