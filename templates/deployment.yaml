apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "live-stream-packager.fullname" . }}
  labels:
    {{- include "live-stream-packager.labels" . | nindent 4 }}
    app.kubernetes.io/component: origin
spec:
  replicas: {{ .Values.replicaCount }}
  # Every pod has its own HLS origin in emptyDir. Overlapping generations can
  # serve a manifest from one origin and a segment from another.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "live-stream-packager.selectorLabels" . | nindent 6 }}
  minReadySeconds: 5
  template:
    metadata:
      labels:
        {{- include "live-stream-packager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: origin
      annotations:
        checksum/nginx-config: {{ include (print $.Template.BasePath "/configmap-nginx.yaml") . | sha256sum }}
        checksum/scripts: {{ include (print $.Template.BasePath "/configmap-scripts.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: shared-data
          emptyDir:
            sizeLimit: {{ .Values.storage.sizeLimit }}
        - name: nginx-config
          configMap:
            name: {{ include "live-stream-packager.fullname" . }}-nginx
        - name: scripts
          configMap:
            name: {{ include "live-stream-packager.fullname" . }}-scripts
            defaultMode: 0555

      containers:
        - name: ffmpeg-transcoder
          image: {{ include "live-stream-packager.image" .Values.image.ffmpeg | quote }}
          imagePullPolicy: {{ .Values.image.ffmpeg.pullPolicy }}
          command: ["/scripts/run-ffmpeg.sh"]
          args:
            {{- range .Values.ffmpeg.inputOptions }}
            - {{ . | quote }}
            {{- end }}
            - -i
            - {{ include "live-stream-packager.ffmpegInputUrl" . | quote }}
            {{- range .Values.ffmpeg.encodingOptions }}
            - {{ . | quote }}
            {{- end }}
            - -force_key_frames:v
            - {{ printf "expr:gte(t,n_forced*%d)" (int .Values.hls.segmentDurationSeconds) | quote }}
            - -sc_threshold:v
            - "0"
            - -f
            - hls
            - -hls_time
            - {{ .Values.hls.segmentDurationSeconds | quote }}
            - -hls_list_size
            - {{ .Values.hls.listSize | quote }}
            - -hls_delete_threshold
            - {{ .Values.hls.deleteThreshold | quote }}
            - -hls_segment_type
            - fmp4
            - -hls_flags
            - delete_segments+independent_segments+program_date_time+temp_file
            - -hls_start_number_source
            - epoch
            - -hls_fmp4_init_filename
            - "%v-init.mp4"
            - -master_pl_name
            - index.m3u8
            - -var_stream_map
            - "a:0,agroup:audio,default:yes,language=no,name:audio v:0,agroup:audio,name:low v:1,agroup:audio,name:high"
            - -hls_segment_filename
            - "/stream/%v-%d.m4s"
            - "/stream/%v.m3u8"
          env:
            - name: OUTPUT_DIR
              value: /stream
            - name: PLAYLIST_PATH
              value: {{ .Values.health.mediaPlaylistPath | quote }}
            - name: PLAYLIST_MAX_AGE_SECONDS
              value: {{ .Values.health.maxAgeSeconds | quote }}
            - name: HEALTH_STATE_PATH
              value: /tmp/ffmpeg-playlist-health.state
          volumeMounts:
            - name: shared-data
              mountPath: /stream
            - name: scripts
              mountPath: /scripts
              readOnly: true
          startupProbe:
            exec:
              command: ["/scripts/playlist-healthcheck.sh", "ready"]
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: {{ .Values.health.startupFailureThreshold }}
          livenessProbe:
            exec:
              command: ["/scripts/playlist-healthcheck.sh", "live"]
            initialDelaySeconds: 60
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: {{ .Values.health.failureThreshold }}
          readinessProbe:
            exec:
              command: ["/scripts/playlist-healthcheck.sh", "ready"]
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: {{ .Values.health.failureThreshold }}
          resources:
            {{- toYaml .Values.resources.ffmpeg | nindent 12 }}

        - name: nginx-web
          image: {{ include "live-stream-packager.image" .Values.image.nginx | quote }}
          imagePullPolicy: {{ .Values.image.nginx.pullPolicy }}
          volumeMounts:
            - name: shared-data
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            tcpSocket:
              port: http
            timeoutSeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /index.m3u8
              port: http
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: {{ .Values.health.failureThreshold }}
          resources:
            {{- toYaml .Values.resources.nginx | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
