{{- if .Values.cubemap.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "live-stream-packager.fullname" . }}-cubemap
  labels:
    {{- include "live-stream-packager.labels" . | nindent 4 }}
    app.kubernetes.io/component: cubemap
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "live-stream-packager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cubemap
  template:
    metadata:
      labels:
        {{- include "live-stream-packager.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cubemap
      annotations:
        checksum/cubemap-config: {{ include (print $.Template.BasePath "/configmap-cubemap.yaml") . | sha256sum }}
        checksum/scripts: {{ include (print $.Template.BasePath "/configmap-scripts.yaml") . | sha256sum }}
    spec:
      volumes:
        - name: cubemap-config
          configMap:
            name: {{ include "live-stream-packager.fullname" . }}-cubemap
        - name: scripts
          configMap:
            name: {{ include "live-stream-packager.fullname" . }}-scripts
            defaultMode: 0555

      containers:
        - name: cubemap
          image: {{ include "live-stream-packager.image" .Values.image.cubemap | quote }}
          imagePullPolicy: {{ .Values.image.cubemap.pullPolicy }}
          args: ["/etc/cubemap/cubemap.config"]
          ports:
            - name: udp-input
              containerPort: {{ .Values.cubemap.udpPort }}
              protocol: UDP
            - name: http
              containerPort: {{ .Values.cubemap.httpPort }}
              protocol: TCP
          volumeMounts:
            - name: cubemap-config
              mountPath: /etc/cubemap
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
          env:
            - name: CUBEMAP_INPUT_MAX_AGE_SECONDS
              value: {{ .Values.cubemap.inputMaxAgeSeconds | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/scripts/cubemap-input-healthcheck.sh"]
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 1
          resources:
            {{- toYaml .Values.resources.cubemap | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
