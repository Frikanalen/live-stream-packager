{{- if .Values.airlog.enabled }}
# Kept apart from the origin's scripts ConfigMap: a change here must not
# change the origin's checksum and restart the public stream.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "live-stream-packager.fullname" . }}-airlog-scripts
  labels:
    {{- include "live-stream-packager.labels" . | nindent 4 }}
    app.kubernetes.io/component: airlog
data:
  run-airlog.sh: |
{{ .Files.Get "scripts/run-airlog.sh" | indent 4 }}
  airlog-healthcheck.sh: |
{{ .Files.Get "scripts/airlog-healthcheck.sh" | indent 4 }}
  airlog-janitor.sh: |
{{ .Files.Get "scripts/airlog-janitor.sh" | indent 4 }}
{{- end }}
