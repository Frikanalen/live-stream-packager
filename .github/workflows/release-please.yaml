name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release PR or GitHub Release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # Keep manifest mode: passing release-type here would bypass the
          # extra-files entry that updates Chart.yaml.
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-chart:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Validate released chart
        run: |
          helm lint --strict .
          sh tests/scripts-test.sh

      - name: Package and publish chart
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chart"
          package_output=$(helm package . --destination "$RUNNER_TEMP/chart")
          package_path=${package_output##*: }
          helm push "$package_path" oci://ghcr.io/frikanalen/charts
