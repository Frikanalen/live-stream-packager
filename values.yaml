nameOverride: ""
fullnameOverride: ""

image:
  ffmpeg:
    repository: jrottenberg/ffmpeg
    tag: 8-alpine
    digest: ""
    pullPolicy: IfNotPresent

  nginx:
    repository: nginx
    tag: 1.30.4-alpine
    digest: ""
    pullPolicy: IfNotPresent

  cubemap:
    repository: ghcr.io/frikanalen/cubemap
    tag: ""
    # Known-good Cubemap 1.5.2 image. Prefer a digest because this repository
    # also publishes a mutable "latest" tag.
    digest: sha256:58228e584fca507b2d18a70c50c4d810de66fa9030a69ef61f76c80071f95478
    pullPolicy: IfNotPresent

# FFmpeg input and transcoding configuration. Arguments are a YAML list so
# Kubernetes passes each item verbatim; filters and expressions are not
# reparsed through a shell.
ffmpeg:
  # When cubemap.enabled, this is overridden to read from Cubemap HTTP.
  inputSourceUrl: "http://192.168.3.1:9094/frikanalen.ts"
  inputOptions:
    - -hide_banner
    - -nostats
    - -loglevel
    - warning
    # Fail instead of blocking forever when Cubemap stops returning bytes.
    - -rw_timeout
    - "15000000"
    - -probesize
    - 100M
  encodingOptions:
    - -pix_fmt
    - yuv420p
    - -filter_complex
    - "[0:v:0]split=2[low][high]"

    - -map
    - 0:a:0
    - -map
    - "[low]"
    - -map
    - "[high]"

    - -codec:a
    - aac
    - -b:a
    - 128k
    - -ar
    - "48000"
    - -ac
    - "2"
    - -codec:v:0
    - libx264
    - -b:v:0
    - 1000k
    - -maxrate:v:0
    - 1500k
    - -bufsize:v:0
    - 2000k
    - -profile:v:0
    - baseline
    - -preset:v:0
    - fast
    - -tune:v:0
    - zerolatency

    - -codec:v:1
    - libx264
    - -b:v:1
    - 4000k
    - -maxrate:v:1
    - 5000k
    - -bufsize:v:1
    - 8000k
    - -preset:v:1
    - fast
    - -tune:v:1
    - zerolatency

# FFmpeg's HLS muxer writes the master playlist, media playlists, init files,
# and fMP4 segments directly into the shared Nginx origin directory.
hls:
  segmentDurationSeconds: 2
  # Five minutes at two seconds per segment.
  listSize: 150
  deleteThreshold: 10

# This chart uses pod-local HLS storage. More than one replica would allow a
# client to fetch a manifest and its segment from different origins.
replicaCount: 1

resources:
  ffmpeg:
    requests:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 256Mi
    limits:
      cpu: "6"
      memory: 2Gi
      ephemeral-storage: 2Gi
  nginx:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  cubemap:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

storage:
  sizeLimit: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# End-to-end health is based on an advancing media playlist and a non-empty
# referenced segment, rather than process existence or a static master file.
health:
  mediaPlaylistPath: /stream/audio.m3u8
  maxAgeSeconds: 30
  startupFailureThreshold: 60  # 60 * 5s = 5 min max startup time
  failureThreshold: 3

service:
  type: ClusterIP
  port: 80

# Cubemap UDP reflector: receives MPEG-TS and serves it over HTTP to FFmpeg.
cubemap:
  enabled: true
  udpPort: 5004
  httpPort: 9094
  loadBalancerIP: "192.168.3.91"
  inputMaxAgeSeconds: 30

ingress:
  enabled: true
  host: "staging.frikanalen.no"
  pathPrefix: "/stream/"
  entryPoints:
    - websecure
  tls:
    enabled: true
    certResolver: letsencrypt
