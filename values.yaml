nameOverride: ""
fullnameOverride: ""

image:
  ffmpeg:
    repository: jrottenberg/ffmpeg
    tag: 8-alpine
    digest: ""
    pullPolicy: IfNotPresent

  nginx:
    repository: nginx
    tag: 1.30.4-alpine
    digest: ""
    pullPolicy: IfNotPresent

  cubemap:
    repository: ghcr.io/frikanalen/cubemap
    tag: ""
    # Known-good Cubemap 1.5.2 image. Prefer a digest because this repository
    # also publishes a mutable "latest" tag.
    digest: sha256:58228e584fca507b2d18a70c50c4d810de66fa9030a69ef61f76c80071f95478
    pullPolicy: IfNotPresent

# FFmpeg input and transcoding configuration. Arguments are a YAML list so
# Kubernetes passes each item verbatim; filters and expressions are not
# reparsed through a shell.
ffmpeg:
  # When cubemap.enabled, this is overridden to read from Cubemap HTTP.
  inputSourceUrl: "http://192.168.3.1:9094/frikanalen.ts"
  inputOptions:
    - -hide_banner
    - -nostats
    - -loglevel
    - warning
    # Fail instead of blocking forever when Cubemap stops returning bytes.
    - -rw_timeout
    - "15000000"
    - -probesize
    - 100M
  encodingOptions:
    - -pix_fmt
    - yuv420p
    - -filter_complex
    - "[0:v:0]split=2[low][high]"

    - -map
    - 0:a:0
    - -map
    - "[low]"
    - -map
    - "[high]"

    - -codec:a
    - aac
    - -b:a
    - 128k
    - -ar
    - "48000"
    - -ac
    - "2"
    - -codec:v:0
    - libx264
    - -b:v:0
    - 1000k
    - -maxrate:v:0
    - 1500k
    - -bufsize:v:0
    - 2000k
    - -profile:v:0
    - baseline
    - -preset:v:0
    - fast
    - -tune:v:0
    - zerolatency

    - -codec:v:1
    - libx264
    - -b:v:1
    - 4000k
    - -maxrate:v:1
    - 5000k
    - -bufsize:v:1
    - 8000k
    - -preset:v:1
    - fast
    - -tune:v:1
    - zerolatency

# FFmpeg's HLS muxer writes the master playlist, media playlists, init files,
# and fMP4 segments directly into the shared Nginx origin directory.
hls:
  segmentDurationSeconds: 2
  # Five minutes at two seconds per segment.
  listSize: 150
  deleteThreshold: 10

# This chart uses pod-local HLS storage. More than one replica would allow a
# client to fetch a manifest and its segment from different origins.
replicaCount: 1

# The two x264 encodes use about five cores. The request is what the stream is
# guaranteed when a node is contended -- CPU is shared out by request -- so it
# has to cover that: on 2026-11-13 staging asked for one core, an ingest worker
# beside it asked for two and took the rest, the packager got about a third of
# the node and its timestamps came apart.
resources:
  ffmpeg:
    requests:
      cpu: "5"
      memory: 1Gi
      ephemeral-storage: 256Mi
    limits:
      cpu: "6"
      memory: 2Gi
      ephemeral-storage: 2Gi
  nginx:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  # Cubemap reads the programme feed as UDP: if it is starved, datagrams are
  # dropped and the transcoder gets corrupt input. It uses little, but has to
  # get it when it needs it.
  cubemap:
    requests:
      cpu: 200m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi

storage:
  sizeLimit: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# Scheduling priority for the packager and Cubemap, so that on a full cluster
# the live stream is placed ahead of (and may preempt) batch work such as
# ingest. With create, the chart makes the cluster-wide PriorityClass itself;
# set create: false to use one that already exists, or name: "" for none.
priorityClass:
  create: true
  name: stream-critical
  value: 1000000

# Alerts for kube-prometheus-stack. Off unless the cluster runs the
# PrometheusRule CRD.
monitoring:
  prometheusRule:
    enabled: false
    # Restarts within the window that mean the stream is unwell. The liveness
    # check restarts a wedged transcoder, so a wedge shows up here.
    restartsWithin15m: 2
    # Share of CPU periods throttled before the stream is called starved.
    throttledRatio: 0.25

# End-to-end health is based on advancing media playlists and non-empty
# referenced segments, rather than process existence or a static master file.
# Every rendition is listed: one can stall while the others keep advancing.
health:
  mediaPlaylistPaths:
    - /stream/audio.m3u8
    - /stream/low.m3u8
    - /stream/high.m3u8
  maxAgeSeconds: 30
  # How many segments apart the renditions' newest segments may be before
  # liveness fails and the transcoder is restarted. 0 turns it off.
  maxSkewSegments: 5
  startupFailureThreshold: 60  # 60 * 5s = 5 min max startup time
  failureThreshold: 3

service:
  type: ClusterIP
  port: 80

# Cubemap UDP reflector: receives MPEG-TS and serves it over HTTP to FFmpeg.
cubemap:
  enabled: true
  hostNetwork: false
  # When set, Cubemap joins this multicast group instead of listening for
  # unicast traffic on udpPort. Requires hostNetwork: true.
  multicastGroup: ""
  udpPort: 5004
  httpPort: 9094
  loadBalancerIP: "192.168.3.91"
  inputMaxAgeSeconds: 30

ingress:
  enabled: true
  className: public
  host: "staging.frikanalen.tv"
  pathPrefix: "/stream/"
  entryPoints:
    - websecure
  tls:
    enabled: true
    certResolver: letsencrypt
