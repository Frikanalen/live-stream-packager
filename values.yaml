nameOverride: ""
fullnameOverride: ""

image:
  ffmpeg:
    repository: jrottenberg/ffmpeg
    tag: 8-alpine
    digest: ""
    pullPolicy: IfNotPresent

  packager:
    repository: google/shaka-packager
    tag: v3.9.3
    digest: ""
    pullPolicy: IfNotPresent

  nginx:
    repository: nginx
    tag: 1.30.4-alpine
    digest: ""
    pullPolicy: IfNotPresent

  cubemap:
    repository: ghcr.io/frikanalen/cubemap
    tag: ""
    # Known-good Cubemap 1.5.2 image. Prefer a digest because this repository
    # also publishes a mutable "latest" tag.
    digest: sha256:58228e584fca507b2d18a70c50c4d810de66fa9030a69ef61f76c80071f95478
    pullPolicy: IfNotPresent

# FFmpeg input and transcoding configuration. Arguments are a YAML list so
# Kubernetes passes each item verbatim; filters and expressions are not
# reparsed through a shell.
ffmpeg:
  # When cubemap.enabled, this is overridden to read from Cubemap HTTP.
  inputSourceUrl: "http://192.168.3.1:9094/frikanalen.ts"
  inputOptions:
    - -hide_banner
    - -nostats
    - -loglevel
    - warning
    # Fail instead of blocking forever when Cubemap stops returning bytes.
    - -rw_timeout
    - "15000000"
    - -probesize
    - 100M
  encodingOptions:
    - -pix_fmt
    - yuv420p
    - -filter_complex
    - "[0:v:0]split=2[low][high]"

    - -map
    - 0:a:0
    - -codec:a
    - libfdk_aac
    - -b:a
    - 128k
    - -ar
    - "48000"
    - -ac
    - "2"
    - -f
    - mpegts
    - udp://127.0.0.1:9000

    - -map
    - "[low]"
    - -b:v
    - 1000k
    - -maxrate:v
    - 1500k
    - -bufsize:v
    - 2000k
    - -profile:v
    - baseline
    - -preset
    - fast
    - -tune
    - zerolatency
    - -g
    - "100"
    - -sc_threshold
    - "0"
    - -codec:v
    - libx264
    - -f
    - mpegts
    - udp://127.0.0.1:9002

    - -map
    - "[high]"
    - -b:v
    - 4000k
    - -maxrate:v
    - 5000k
    - -bufsize:v
    - 8000k
    - -preset
    - fast
    - -tune
    - zerolatency
    - -g
    - "100"
    - -sc_threshold
    - "0"
    - -codec:v
    - libx264
    - -f
    - mpegts
    - udp://127.0.0.1:9003

# Shaka Packager configuration. The wrapper adds wall-clock-derived
# --hls_media_sequence_number and --start_segment_number values on each start.
shaka:
  segmentDurationSeconds: 2
  segmentRetentionMinutes: 15
  arguments:
    - "in=udp://0.0.0.0:9000?buffer_size=212992&timeout=15000000,stream=audio,bw=144000,init_segment=livehd-audio.mp4,segment_template=livehd-audio-$Number$.mp4,playlist_name=audio.m3u8,hls_group_id=audio,hls_name=Norwegian,language=no"
    - "in=udp://0.0.0.0:9002?buffer_size=212992&timeout=15000000,stream=video,bw=1500000,init_segment=livehd-video-low.mp4,segment_template=livehd-video-low-$Number$.mp4,playlist_name=video-low.m3u8"
    - "in=udp://0.0.0.0:9003?buffer_size=212992&timeout=15000000,stream=video,bw=5000000,init_segment=livehd-video-high.mp4,segment_template=livehd-video-high-$Number$.mp4,playlist_name=video-high.m3u8"
    - --mpd_output=index.mpd
    - --dump_stream_info
    - --min_buffer_time=12
    - --hls_playlist_type=LIVE
    - --hls_master_playlist_output=index.m3u8
    - --time_shift_buffer_depth=300
    - --preserved_segments_outside_live_window=10
    - --segment_duration=2
    - --io_block_size=65536

# This chart uses pod-local HLS storage. More than one replica would allow a
# client to fetch a manifest and its segment from different origins.
replicaCount: 1

resources:
  ffmpeg:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "6"
      memory: 2Gi
  packager:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 2Gi
  nginx:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi
  cubemap:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

storage:
  sizeLimit: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

# End-to-end health is based on an advancing media playlist and a non-empty
# referenced segment, rather than process existence or a static master file.
health:
  mediaPlaylistPath: /stream/audio.m3u8
  maxAgeSeconds: 30
  startupFailureThreshold: 60  # 60 * 5s = 5 min max startup time
  failureThreshold: 3

service:
  type: ClusterIP
  port: 80

# Cubemap UDP reflector: receives MPEG-TS and serves it over HTTP to FFmpeg.
cubemap:
  enabled: true
  udpPort: 5004
  httpPort: 9094
  loadBalancerIP: "192.168.3.91"
  inputMaxAgeSeconds: 30

ingress:
  enabled: true
  host: "staging.frikanalen.no"
  pathPrefix: "/stream/"
  entryPoints:
    - websecure
  tls:
    enabled: true
    certResolver: letsencrypt
